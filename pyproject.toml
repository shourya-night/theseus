[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "theseus"
version = "0.1.0"
description = "THESEUS: Astrodynamics & Spacecraft Mission-Analysis Simulation Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5.3",
    "pandas>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["theseus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
